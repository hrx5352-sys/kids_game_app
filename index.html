<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Balloon Pop!</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #4CA1AF, #C4E0E5);
            /* More vibrant sky */
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            touch-action: manipulation;
            user-select: none;
        }

        /* --- BACKGROUND CLOUDS --- */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            animation: moveClouds linear infinite;
            z-index: 1;
            /* Behind everything else */
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
        }

        .cloud1 {
            width: 150px;
            height: 50px;
            top: 15%;
            animation-duration: 40s;
        }

        .cloud1::before {
            width: 70px;
            height: 70px;
            top: -30px;
            left: 20px;
        }

        .cloud1::after {
            width: 90px;
            height: 90px;
            top: -45px;
            right: 20px;
        }

        .cloud2 {
            width: 100px;
            height: 35px;
            top: 35%;
            animation-duration: 30s;
            opacity: 0.6;
            transform: scale(0.6);
        }

        .cloud2::before {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 15px;
        }

        .cloud2::after {
            width: 60px;
            height: 60px;
            top: -30px;
            right: 15px;
        }

        .cloud3 {
            width: 200px;
            height: 65px;
            top: 60%;
            animation-duration: 55s;
            opacity: 0.9;
        }

        .cloud3::before {
            width: 90px;
            height: 90px;
            top: -40px;
            left: 25px;
        }

        .cloud3::after {
            width: 120px;
            height: 120px;
            top: -60px;
            right: 25px;
        }

        @keyframes moveClouds {
            0% {
                left: -300px;
            }

            100% {
                left: 100vw;
            }
        }

        /* ------------------------- */

        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 36px;
            font-weight: bold;
            color: #FF4500;
            text-shadow: 3px 3px 0px white, -1px -1px 0px white, 1px -1px 0px white, -1px 1px 0px white, 1px 1px 0px white;
            z-index: 10;
        }

        #audio-controls {
            position: absolute;
            top: 20px;
            left: 200px;
            z-index: 15;
        }

        #audio-btn {
            font-size: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }

        #audio-btn:active {
            transform: scale(0.9);
        }

        #lives-board {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 36px;
            z-index: 10;
        }

        .life {
            color: #FF2D55;
            text-shadow: 2px 2px 0px white;
            margin-left: 5px;
            transition: opacity 0.3s;
        }

        .life.lost {
            opacity: 0.2;
            color: #555;
        }

        .balloon {
            position: absolute;
            bottom: -150px;
            width: 80px;
            height: 100px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            cursor: pointer;
            box-shadow: inset -15px -15px 20px rgba(0, 0, 0, 0.15);
            /* Gives it a 3D rounded look */
        }

        /* Adds a little shine reflection to the balloon */
        .balloon::after {
            content: "";
            position: absolute;
            top: 15px;
            left: 15px;
            width: 20px;
            height: 35px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .rock {
            position: absolute;
            bottom: -150px;
            width: 70px;
            height: 60px;
            background-color: #555;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            /* Make it look like a jagged rock */
            cursor: pointer;
            box-shadow: inset -10px -10px 15px rgba(0, 0, 0, 0.5), 5px 5px 10px rgba(0, 0, 0, 0.3);
        }

        .rock::after {
            content: "";
            position: absolute;
            top: 10px;
            left: 15px;
            width: 30px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            transform: rotate(-20deg);
        }

        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            font-size: 48px;
            text-align: center;
        }

        .game-over-screen button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 24px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #34C759;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #248A3D;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .game-over-screen button:active,
        #start-screen button:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #248A3D;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(76, 161, 175, 0.9), rgba(196, 224, 229, 0.9));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            text-align: center;
        }

        .title-text {
            font-size: 64px;
            font-weight: bold;
            color: #FF2D55;
            text-shadow: 4px 4px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white, 2px 2px 0px white;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-30px);
            }

            60% {
                transform: translateY(-15px);
            }
        }

        .pop-text {
            position: absolute;
            font-size: 30px;
            font-weight: bold;
            color: yellow;
            pointer-events: none;
            text-shadow: 2px 2px 0px red;
            animation: floatUpWord 0.8s ease-out forwards;
        }

        @keyframes floatUpWord {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -80%) scale(1.5);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -100%) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Decorative Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2" style="animation-delay: -15s;"></div>
    <div class="cloud cloud3" style="animation-delay: -5s;"></div>

    <div id="score-board">Score: <span id="score">0</span></div>
    <div id="audio-controls" style="display: none;">
        <button id="audio-btn" onclick="toggleAudio()">🔊</button>
    </div>
    <div id="lives-board">
        <span class="life" id="life-1">❤️</span>
        <span class="life" id="life-2">❤️</span>
        <span class="life" id="life-3">❤️</span>
    </div>

    <div id="game-over" class="game-over-screen">
        <div id="game-over-reason">Oh no! You touched a rock!</div>
        <div style="font-size: 32px; margin-top: 10px;">Final Score: <span id="final-score">0</span></div>
        <button onclick="restartGame()">Play Again</button>
    </div>

    <!-- Start Screen to initialize audio -->
    <div id="start-screen">
        <div class="title-text">Balloon Pop!</div>
        <div style="font-size: 24px; color: #333; margin-bottom: 30px;">Pop balloons! 🎈 Avoid rocks! 🪨</div>
        <button onclick="startGame()">Start Playing</button>
    </div>

    <script>
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let gameInterval;
        let baseSpawnRate = 800; // milliseconds
        let baseSpeedMin = 4; // seconds
        let baseSpeedMax = 7; // seconds

        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const gameOverReason = document.getElementById('game-over-reason');
        const finalScoreElement = document.getElementById('final-score');
        const life1 = document.getElementById('life-1');
        const life2 = document.getElementById('life-2');
        const life3 = document.getElementById('life-3');
        const audioBtn = document.getElementById('audio-btn');

        // Bright, kid-friendly colors
        const colors = ['#FF3B30', '#34C759', '#007AFF', '#FFCC00', '#AF52DE', '#FF9500', '#FF2D55'];

        // --- AUDIO SYSTEM (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAudioEnabled = true; // Default to ON, but starts suspended by browser
        let bgmOscillator = null;
        let bgmGain = null;
        let bgmInterval = null;

        // BGM Notes (Simple happy melody: C, E, G, A, G, E, C...)
        const melody = [261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 261.63, 196.00];

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            if (isAudioEnabled) {
                audioBtn.innerText = '🔊';
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                startBGM();
            } else {
                audioBtn.innerText = '🔇';
                stopBGM();
            }
        }

        function playSound(type) {
            if (!isAudioEnabled) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'pop') {
                // High quick pop sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'rock') {
                // Low crash sound
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'loseLife') {
                // Sad descending sound
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        function startBGM() {
            if (bgmInterval) return;
            let noteIndex = 0;

            // Play a note every 400ms
            bgmInterval = setInterval(() => {
                if (!isAudioEnabled) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.value = melody[noteIndex % melody.length];

                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); // Very quiet BGM
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);

                noteIndex++;
            }, 400);
        }

        function stopBGM() {
            clearInterval(bgmInterval);
            bgmInterval = null;
        }
        // --- END AUDIO SYSTEM ---

        function updateDifficulty() {
            // As score goes up, speed increases and spawn rate gets faster
            // Every 50 points, it gets a little harder
            let level = Math.floor(score / 50);

            // Max out difficulty at level 10 to avoid it becoming impossible
            if (level > 10) level = 10;

            baseSpawnRate = 800 - (level * 40); // Spawns faster
            baseSpeedMin = 4 - (level * 0.2); // Moves faster
            baseSpeedMax = 7 - (level * 0.3);

            // Restart the interval with the new spawn rate
            clearInterval(gameInterval);
            if (!isGameOver) {
                gameInterval = setInterval(createObject, baseSpawnRate);
            }
        }

        function loseLife() {
            if (isGameOver) return;

            playSound('loseLife');
            lives--;
            if (lives === 2) life3.classList.add('lost');
            if (lives === 1) life2.classList.add('lost');
            if (lives === 0) {
                life1.classList.add('lost');
                gameOver("Oh no! 3 balloons blew away!");
            }
        }

        function createObject() {
            if (isGameOver) return;

            // 20% chance to spawn a rock instead of a balloon
            const isRock = Math.random() < 0.2;

            if (isRock) {
                createRock();
            } else {
                createBalloon();
            }
        }

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('balloon');

            // Pick a random color
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            balloon.style.backgroundColor = randomColor;

            // Create the little knot at the bottom of the balloon
            const knot = document.createElement('div');
            knot.style.position = 'absolute';
            knot.style.bottom = '-12px';
            knot.style.left = '50%';
            knot.style.transform = 'translateX(-50%)';
            knot.style.width = '0';
            knot.style.height = '0';
            knot.style.borderLeft = '10px solid transparent';
            knot.style.borderRight = '10px solid transparent';
            knot.style.borderBottom = `14px solid ${randomColor}`;
            balloon.appendChild(knot);

            // Random horizontal start position
            const xPos = Math.random() * (window.innerWidth - 100);
            balloon.style.left = `${xPos}px`;

            // Random float speed based on current difficulty
            const duration = Math.random() * (baseSpeedMax - baseSpeedMin) + baseSpeedMin;
            balloon.style.transition = `bottom ${duration}s linear`;

            document.body.appendChild(balloon);

            // Start animation (floating up)
            setTimeout(() => {
                balloon.style.bottom = `${window.innerHeight + 150}px`;
            }, 50);

            // Listen for taps/clicks
            balloon.addEventListener('pointerdown', (e) => {
                // Prevent default behavior so scrolling doesn't happen on mobile
                e.preventDefault();
                popBalloon(balloon, e.clientX, e.clientY);
            });

            // Clean up balloons that float off the screen without being popped
            setTimeout(() => {
                if (document.body.contains(balloon)) {
                    balloon.remove();
                    // If a balloon escapes and wasn't popped, lose a life!
                    loseLife();
                }
            }, duration * 1000);
        }

        // Handle the popping action
        function popBalloon(balloon, x, y) {
            if (isGameOver) return;
            balloon.remove(); // Remove the balloon

            playSound('pop');

            // Increase score
            score += 10;
            scoreElement.innerText = score;

            // Adjust difficulty based on new score
            updateDifficulty();

            // Show "POP!" text animation
            const popText = document.createElement('div');
            popText.classList.add('pop-text');
            popText.innerText = 'POP!';
            popText.style.left = `${x}px`;
            popText.style.top = `${y}px`;
            document.body.appendChild(popText);

            // Remove the pop text after animation
            setTimeout(() => {
                popText.remove();
            }, 800);
        }

        function createRock() {
            const rock = document.createElement('div');
            rock.classList.add('rock');

            // Random horizontal start position
            const xPos = Math.random() * (window.innerWidth - 80);
            rock.style.left = `${xPos}px`;

            // Random float speed (slightly faster than balloons to make it tricky)
            // Rocks are always about 1 second faster than the current min balloon speed
            const duration = Math.max(1.5, Math.random() * (baseSpeedMax - baseSpeedMin) + (baseSpeedMin - 1));
            rock.style.transition = `bottom ${duration}s linear`;

            document.body.appendChild(rock);

            // Start animation (falling down from top... wait, let's make it fly up like a heavy balloon)
            setTimeout(() => {
                rock.style.bottom = `${window.innerHeight + 150}px`;
            }, 50);

            // Listen for taps/clicks on the rock
            rock.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                playSound('rock');
                rock.remove();
                gameOver("Oh no! You touched a rock!");
            });

            // Clean up rocks that float off the screen 
            setTimeout(() => {
                if (document.body.contains(rock)) {
                    rock.remove();
                    // Rocks floating away is good! No penalty.
                }
            }, duration * 1000);
        }

        function gameOver(reason) {
            isGameOver = true;
            clearInterval(gameInterval); // Stop spawning new things
            stopBGM(); // Stop music

            // Set the reason text
            gameOverReason.innerText = reason;

            // Stop all objects currently on screen from moving
            const allBalloons = document.querySelectorAll('.balloon');
            const allRocks = document.querySelectorAll('.rock');

            allBalloons.forEach(b => {
                const currentBottom = window.getComputedStyle(b).getPropertyValue('bottom');
                b.style.transition = 'none';
                b.style.bottom = currentBottom;
                b.style.pointerEvents = 'none'; // Can't click them anymore
            });

            allRocks.forEach(r => {
                const currentBottom = window.getComputedStyle(r).getPropertyValue('bottom');
                r.style.transition = 'none';
                r.style.bottom = currentBottom;
                r.style.pointerEvents = 'none';
            });

            // Show Game Over screen
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            // Hide game over screen
            gameOverScreen.style.display = 'none';

            // Reset score, lives, and state
            score = 0;
            lives = 3;
            baseSpawnRate = 800;
            baseSpeedMin = 4;
            baseSpeedMax = 7;

            scoreElement.innerText = score;

            // Reset heart icons visually
            life1.classList.remove('lost');
            life2.classList.remove('lost');
            life3.classList.remove('lost');

            isGameOver = false;

            // Remove any leftover balloons or rocks from the previous game
            const allBalloons = document.querySelectorAll('.balloon');
            const allRocks = document.querySelectorAll('.rock');
            allBalloons.forEach(b => b.remove());
            allRocks.forEach(r => r.remove());

            // Check if audio is enabled and restart BGM
            if (isAudioEnabled) {
                startBGM();
            }

            // Restart the spawner
            gameInterval = setInterval(createObject, baseSpawnRate);
        }

        // New function to handle the very first launch 
        // This is needed because browsers require a user click BEFORE playing audio
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('audio-controls').style.display = 'block';

            // Resume hidden audio context on first click
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isAudioEnabled) {
                startBGM();
            }

            gameInterval = setInterval(createObject, baseSpawnRate);
        }

        // We DO NOT start automatically anymore. Wait for the 'Start Playing' button.
        // gameInterval = setInterval(createObject, baseSpawnRate);
    </script>
</body>

</html>
